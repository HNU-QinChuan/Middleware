syntax = "proto3";
import "Std/Header.proto";
import "Sensor/PointField.proto";
package Sensor;


message PointCloud2{
  Std.Header header = 1;
  uint32 height=2;
  uint32 width=3;
  repeated PointField fields=4;
  bool is_bigendian=5;
  uint32 point_step=6;
  uint32 row_step=7;
  bytes data=8;
  bool is_dense=9;

}